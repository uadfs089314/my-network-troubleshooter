<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPing</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>MyPing</h1>
        <span class="status-badge">Ready</span>
      </header>

      <section class="card">
        <h2>Network Troubleshooter</h2>
        <p>
          This is the Tauri frontend shell for the desktop app. The app logic can be
          expanded here as needed.
        </p>
        <button id="ping-button">Run health check</button>
      </section>

      <section class="card output-card">
        <h3>Output</h3>
        <pre id="output">Waiting for a check...</pre>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
