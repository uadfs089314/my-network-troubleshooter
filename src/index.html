<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPing</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Monitoring</p>
          <h1>MyPing</h1>
        </div>
        <div id="status-badge" class="status-badge neutral">Checking</div>
      </header>

      <main>
        <section class="card monitor-header">
          <div class="host-field">
            <span>Target host</span>
            <input id="host-input" type="text" value="example.com" />
          </div>
        </section>

        <section class="stats-grid">
          <div class="stat-card card">
            <span class="label">Latency</span>
            <strong id="latency-value">--</strong>
            <small>ms</small>
          </div>
          <div class="stat-card card">
            <span class="label">Connection</span>
            <strong id="connected-value">--</strong>
            <small>status</small>
          </div>
          <div class="stat-card card">
            <span class="label">DNS</span>
            <strong id="dns-value">--</strong>
            <small>lookup</small>
          </div>
          <div class="stat-card card">
            <span class="label">HTTPS</span>
            <strong id="https-value">--</strong>
            <small>reachability</small>
          </div>
        </section>

        <section class="card output-card">
          <p id="issue-summary" class="summary">Monitoring your connection and looking for service issues.</p>
          <pre id="output">Waiting for diagnostics…</pre>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
