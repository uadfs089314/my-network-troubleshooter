name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
          profile: minimal

      - name: Install dependencies
        run: |
          npm install

      - name: Build Tauri app for macOS
        run: |
          if [ "${{ matrix.target }}" = "x86_64" ]; then
            export TAURI_TARGET=x86_64-apple-darwin
          else
            export TAURI_TARGET=aarch64-apple-darwin
          fi
          npm run tauri build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: myping-macos-${{ matrix.target }}
          path: src-tauri/target/*/bundle/

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          profile: minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app for Linux
        run: |
          export TAURI_TARGET=x86_64-unknown-linux-gnu
          npm run tauri build

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: myping-linux-${{ matrix.target }}
          path: src-tauri/target/*/bundle/

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          profile: minimal

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app for Windows
        run: |
          $env:TAURI_TARGET = "x86_64-pc-windows-msvc"
          npm run tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: myping-windows-${{ matrix.target }}
          path: src-tauri/target/*/bundle/

  build-ios:
    name: Build for iOS (iPhone)
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          profile: minimal

      - name: Install iOS dependencies
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          npm install

      - name: Build Tauri app for iOS
        run: |
          export TAURI_TARGET=aarch64-apple-ios
          npm run tauri build -- --target ios
        continue-on-error: true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myping-ios-iphone
          path: src-tauri/target/*/bundle/

  release:
    name: Create Release
    needs: [build-macos, build-linux, build-windows, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MyPing v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}